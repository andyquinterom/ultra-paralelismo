<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650"
     font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#a8680a"/>
    </marker>
  </defs>

  <rect width="1000" height="650" fill="#ffffff"/>

  <text x="60" y="50" font-size="27" font-weight="700" fill="#1a1a1a">as_simd::&lt;8&gt;() y la alineación de memoria</text>
  <text x="60" y="80" font-size="15" fill="#555">data: &amp;[f64] — cada f64 = 8 bytes · Simd&lt;f64, 8&gt; = 64 bytes y exige una dirección múltiplo de 64</text>

  <!-- dimensión 64 bytes -->
  <line x1="230" y1="150" x2="550" y2="150" stroke="#888" stroke-width="1.5"/>
  <line x1="230" y1="144" x2="230" y2="156" stroke="#888" stroke-width="1.5"/>
  <line x1="550" y1="144" x2="550" y2="156" stroke="#888" stroke-width="1.5"/>
  <text x="390" y="139" text-anchor="middle" font-size="13" fill="#666">64 bytes = 8 × f64</text>

  <!-- direcciones -->
  <text x="64" y="176" font-size="13" fill="#333">base 0x…20</text>
  <text x="230" y="176" text-anchor="middle" font-size="13" fill="#1c4fa1">0x…40</text>
  <text x="550" y="176" text-anchor="middle" font-size="13" fill="#1c4fa1">0x…80</text>
  <text x="870" y="176" text-anchor="middle" font-size="13" fill="#1c4fa1">0x…C0</text>

  <!-- regla -->
  <line x1="70" y1="188" x2="950" y2="188" stroke="#bbbbbb" stroke-width="1.5"/>

  <!-- fronteras de alineación -->
  <line x1="230" y1="188" x2="230" y2="290" stroke="#2f6fdb" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="550" y1="188" x2="550" y2="290" stroke="#2f6fdb" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="870" y1="188" x2="870" y2="290" stroke="#2f6fdb" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- anotación del prefijo -->
  <text x="150" y="216" text-anchor="middle" font-size="13" fill="#a8680a">faltan 32 B (4 × f64) para alinear</text>
  <line x1="72" y1="226" x2="226" y2="226" stroke="#a8680a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- banda del cuerpo alineado -->
  <rect x="230" y="238" width="640" height="52" fill="#eef4fe"/>

  <!-- celdas de memoria -->
  <g stroke-width="1.5">
    <rect x="71"  y="240" width="38" height="48" rx="3" fill="#fdecc8" stroke="#d99a2b"/>
    <rect x="111" y="240" width="38" height="48" rx="3" fill="#fdecc8" stroke="#d99a2b"/>
    <rect x="151" y="240" width="38" height="48" rx="3" fill="#fdecc8" stroke="#d99a2b"/>
    <rect x="191" y="240" width="38" height="48" rx="3" fill="#fdecc8" stroke="#d99a2b"/>
    <rect x="231" y="240" width="38" height="48" rx="3" fill="#dbe8fb" stroke="#2f6fdb"/>
    <rect x="271" y="240" width="38" height="48" rx="3" fill="#dbe8fb" stroke="#2f6fdb"/>
    <rect x="311" y="240" width="38" height="48" rx="3" fill="#dbe8fb" stroke="#2f6fdb"/>
    <rect x="351" y="240" width="38" height="48" rx="3" fill="#dbe8fb" stroke="#2f6fdb"/>
    <rect x="391" y="240" width="38" height="48" rx="3" fill="#dbe8fb" stroke="#2f6fdb"/>
    <rect x="431" y="240" width="38" height="48" rx="3" fill="#dbe8fb" stroke="#2f6fdb"/>
    <rect x="471" y="240" width="38" height="48" rx="3" fill="#dbe8fb" stroke="#2f6fdb"/>
    <rect x="511" y="240" width="38" height="48" rx="3" fill="#dbe8fb" stroke="#2f6fdb"/>
    <rect x="551" y="240" width="38" height="48" rx="3" fill="#dbe8fb" stroke="#2f6fdb"/>
    <rect x="591" y="240" width="38" height="48" rx="3" fill="#dbe8fb" stroke="#2f6fdb"/>
    <rect x="631" y="240" width="38" height="48" rx="3" fill="#dbe8fb" stroke="#2f6fdb"/>
    <rect x="671" y="240" width="38" height="48" rx="3" fill="#dbe8fb" stroke="#2f6fdb"/>
    <rect x="711" y="240" width="38" height="48" rx="3" fill="#dbe8fb" stroke="#2f6fdb"/>
    <rect x="751" y="240" width="38" height="48" rx="3" fill="#dbe8fb" stroke="#2f6fdb"/>
    <rect x="791" y="240" width="38" height="48" rx="3" fill="#dbe8fb" stroke="#2f6fdb"/>
    <rect x="831" y="240" width="38" height="48" rx="3" fill="#dbe8fb" stroke="#2f6fdb"/>
    <rect x="871" y="240" width="38" height="48" rx="3" fill="#fdecc8" stroke="#d99a2b"/>
    <rect x="911" y="240" width="38" height="48" rx="3" fill="#fdecc8" stroke="#d99a2b"/>
  </g>

  <!-- índices -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="90" y="270">0</text><text x="130" y="270">1</text><text x="170" y="270">2</text><text x="210" y="270">3</text>
    <text x="250" y="270">4</text><text x="290" y="270">5</text><text x="330" y="270">6</text><text x="370" y="270">7</text>
    <text x="410" y="270">8</text><text x="450" y="270">9</text><text x="490" y="270">10</text><text x="530" y="270">11</text>
    <text x="570" y="270">12</text><text x="610" y="270">13</text><text x="650" y="270">14</text><text x="690" y="270">15</text>
    <text x="730" y="270">16</text><text x="770" y="270">17</text><text x="810" y="270">18</text><text x="850" y="270">19</text>
    <text x="890" y="270">20</text><text x="930" y="270">21</text>
  </g>

  <!-- corchetes de agrupación -->
  <g stroke-width="1.5" fill="none">
    <line x1="70"  y1="306" x2="230" y2="306" stroke="#d99a2b"/>
    <line x1="70"  y1="306" x2="70"  y2="314" stroke="#d99a2b"/>
    <line x1="230" y1="306" x2="230" y2="314" stroke="#d99a2b"/>

    <line x1="230" y1="306" x2="550" y2="306" stroke="#2f6fdb"/>
    <line x1="230" y1="306" x2="230" y2="314" stroke="#2f6fdb"/>
    <line x1="550" y1="306" x2="550" y2="314" stroke="#2f6fdb"/>

    <line x1="550" y1="306" x2="870" y2="306" stroke="#2f6fdb"/>
    <line x1="550" y1="306" x2="550" y2="314" stroke="#2f6fdb"/>
    <line x1="870" y1="306" x2="870" y2="314" stroke="#2f6fdb"/>

    <line x1="870" y1="306" x2="950" y2="306" stroke="#d99a2b"/>
    <line x1="870" y1="306" x2="870" y2="314" stroke="#d99a2b"/>
    <line x1="950" y1="306" x2="950" y2="314" stroke="#d99a2b"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="150" y="332" fill="#a8680a">prefijo · 4 f64 · 32 B</text>
    <text x="390" y="332" fill="#1c4fa1">Simd&lt;f64,8&gt; · 64 B</text>
    <text x="710" y="332" fill="#1c4fa1">Simd&lt;f64,8&gt; · 64 B</text>
    <text x="910" y="332" fill="#a8680a">sufijo · 2 f64</text>
  </g>

  <!-- leyenda -->
  <rect x="60"  y="362" width="20" height="14" rx="2" fill="#fdecc8" stroke="#d99a2b"/>
  <text x="88"  y="374" font-size="13" fill="#333">escalar (prefijo / sufijo)</text>
  <rect x="320" y="362" width="20" height="14" rx="2" fill="#dbe8fb" stroke="#2f6fdb"/>
  <text x="348" y="374" font-size="13" fill="#333">cuerpo alineado · Simd&lt;f64, 8&gt;</text>
  <line x1="640" y1="369" x2="662" y2="369" stroke="#2f6fdb" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="672" y="374" font-size="13" fill="#333">frontera de alineación (múltiplo de 64 B)</text>

  <!-- panel de código -->
  <rect x="60" y="400" width="880" height="150" rx="6" fill="#f7f7f9" stroke="#dddddd"/>
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14">
    <text x="82" y="434" fill="#1a1a1a">let (</text>
    <text x="120" y="434" fill="#a8680a">prefijo</text>
    <text x="178" y="434" fill="#1a1a1a">, </text>
    <text x="192" y="434" fill="#1c4fa1">vectores</text>
    <text x="264" y="434" fill="#1a1a1a">, </text>
    <text x="278" y="434" fill="#a8680a">sufijo</text>
    <text x="334" y="434" fill="#1a1a1a">) = data.as_simd::&lt;8&gt;();</text>
    <text x="82" y="466" fill="#777">// prefijo: escalar · vectores: &amp;[Simd&lt;f64,8&gt;] · sufijo: escalar</text>
  </g>
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#1a1a1a">
    <text x="82" y="500">let mut suma_vec = Simd::splat(0.0);</text>
    <text x="82" y="530">for &amp;vector in vectores { suma_vec += vector; }</text>
  </g>

  <text x="60" y="592" font-size="13" fill="#666">El tamaño del prefijo depende de la dirección base (el asignador suele dar alineación de 16 B); el sufijo depende del largo de los datos.</text>
</svg>
